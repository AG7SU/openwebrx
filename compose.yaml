name: openwebrx-modern

services:
  receiver:
    image: openwebrx-modern:${OPENWEBRX_VERSION:-1.2.126}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OPENWEBRX_VERSION: ${OPENWEBRX_VERSION:-1.2.126}
        OPENWEBRX_BASE_IMAGE: ${OPENWEBRX_BASE_IMAGE:-slechev/openwebrxplus:1.2.126@sha256:967182a51ebaef5f79ccab60205ff85228c0aa5bcb8518d7940eb43c0df17361}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${OPENWEBRX_BIND_ADDRESS:-127.0.0.1}:${OPENWEBRX_PORT:-8073}:8073"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - receiver-config:/etc/openwebrx
      - receiver-data:/var/lib/openwebrx
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1g
    healthcheck:
      test: ["CMD-SHELL", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: ${OPENWEBRX_MEMORY_LIMIT:-4g}
    cpus: ${OPENWEBRX_CPUS:-4.0}

volumes:
  receiver-config:
  receiver-data:
